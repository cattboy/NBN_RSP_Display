<!DOCTYPE html>
<html ng-app="contactApp">
<head>
    <title>Contact Directory</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .container {
            text-align: center;
            margin: 20px;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.2.32/angular.min.js"></script>
    <script src="js/controller.js"></script>
</head>
<body ng-controller="ContactController">
    <div class="container">
        <h1>Contact Directory</h1>
        
        <table class="contact-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Website</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="contact in contacts | orderBy:'name'">
                    <td style="text-align:left">{{contact.name}}</td>
                    <td>{{contact.phone}}</td>
                    <td><a href="{{contact.website}}" target="_blank">Visit Website</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
